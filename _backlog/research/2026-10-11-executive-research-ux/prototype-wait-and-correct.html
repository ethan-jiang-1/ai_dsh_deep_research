<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研究等候与纠偏 · 交互原型</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202a33;background:#f3f5f4;font-size:14px;line-height:1.5;--ink:#202a33;--muted:#65736f;--line:#dbe2df;--surface:#fff;--green:#13795b;--green-bg:#e4f3ed;--amber:#9a5c00;--amber-bg:#fff2d7;--red:#a3352a;--red-bg:#fae9e6;--blue:#315b79;--blue-bg:#e8f0f5}*{box-sizing:border-box}body{margin:0}.shell{max-width:1240px;margin:auto;min-height:100vh;background:#f8faf9;border-inline:1px solid #e5eae8}.top{height:54px;padding:0 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fff}.brand{font-weight:700}.workspace{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:calc(100vh - 54px)}main{padding:26px clamp(18px,4vw,52px) 110px;max-width:900px}.side{background:#f1f5f3;border-left:1px solid var(--line);padding:22px 18px}.kicker{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.06em}.title{font-size:24px;line-height:1.25;margin:5px 0 4px}.sub{color:var(--muted);margin:0 0 22px}.summary{border:1px solid var(--line);border-radius:6px;background:#fff;padding:15px 17px;margin-bottom:18px}.summary-head{display:flex;align-items:center;gap:8px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}.dot.wait{background:#d18b12}.dot.issue{background:var(--red)}.summary p{margin:7px 0 0;color:#46534e}.timeline{display:grid;grid-template-columns:repeat(7,minmax(70px,1fr));gap:0;position:relative;margin:23px 0 22px}.timeline:before{content:"";position:absolute;left:4%;right:4%;top:10px;border-top:2px solid var(--line)}.step{position:relative;text-align:center;font-size:11px;color:#78847f;padding-top:25px}.step:before{content:"";position:absolute;z-index:1;top:4px;left:calc(50% - 6px);width:12px;height:12px;border:2px solid #aeb9b4;background:#f8faf9;border-radius:50%}.step.done{color:var(--green)}.step.done:before{background:var(--green);border-color:var(--green)}.step.current{color:var(--ink);font-weight:700}.step.current:before{background:#fff;border:4px solid var(--green);width:14px;height:14px;top:3px;left:calc(50% - 7px)}.step.attn:before{border-color:#d18b12}.narrative{background:var(--green-bg);border-left:3px solid var(--green);padding:12px 14px;margin:18px 0;border-radius:2px}.narrative.warn{background:var(--amber-bg);border-color:#c17b00}.narrative.error{background:var(--red-bg);border-color:var(--red)}.narrative strong{display:block;margin-bottom:3px}.section{margin-top:25px}.section h2{font-size:15px;margin:0 0 10px}.checklist{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:5px}.row small{color:var(--muted)}.status{white-space:nowrap;color:var(--green);font-size:12px}.status.warn{color:var(--amber)}.status.bad{color:var(--red)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}.button{border:1px solid #b7c5bf;background:white;color:var(--ink);border-radius:5px;padding:9px 13px;font:inherit;cursor:pointer}.button:hover{background:#f0f5f2}.button.primary{background:#146c52;color:white;border-color:#146c52}.button.primary:hover{background:#0d5b43}.button.danger{color:var(--red);border-color:#ddb3ad}.button:disabled{opacity:.5;cursor:not-allowed}.side h2{font-size:14px;margin:0 0 12px}.side .box{border-top:1px solid var(--line);padding:12px 0}.side p{margin:5px 0;color:#46534e;font-size:13px}.side .muted{color:var(--muted)}.tag{display:inline-block;background:#e6ece9;border-radius:3px;padding:2px 7px;font-size:11px;color:#45554e}.feed{display:grid;gap:0}.event{display:grid;grid-template-columns:16px 1fr;gap:7px;padding:8px 0;border-top:1px solid var(--line);font-size:12px;color:#4d5954}.event b{font-weight:600;color:var(--ink)}.eicon{color:var(--green)}.issue-card{background:#fff;border:1px solid #e4c9a2;border-radius:5px;padding:13px;margin:12px 0}.issue-card h3{font-size:14px;margin:0 0 5px}.issue-card p{font-size:13px;margin:0;color:#5f5545}.issue-card select,.issue-card textarea{width:100%;margin-top:9px;padding:9px;border:1px solid #cbd4cf;border-radius:4px;background:#fff;font:inherit;color:var(--ink)}.issue-card textarea{min-height:70px;resize:vertical}.issue-card label{display:block;font-size:12px;font-weight:600;margin-top:10px}.hidden{display:none!important}.toast{margin:10px 0;padding:10px;background:var(--blue-bg);border-left:3px solid var(--blue);font-size:13px}.gate{padding:12px;border:1px solid #e4d6b5;background:#fffbf1;border-radius:5px;font-size:12px;color:#5f5545}.gate b{display:block;margin-bottom:3px;color:#343d36}.phase-detail{display:flex;align-items:start;gap:10px}.phase-no{font-weight:700;color:var(--green);font-size:12px;min-width:62px}.side button{font:inherit}.switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#202a33;color:#fff;border-radius:6px;padding:7px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 18px #18211e33;font-size:12px;z-index:5}.switcher button{width:30px;height:30px;border:0;background:#36454e;color:#fff;border-radius:4px;font-size:18px;cursor:pointer}.switcher span{min-width:245px;text-align:center}.annotation{font-size:11px;color:#717c77;margin-top:15px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line);padding:18px 22px}.timeline{grid-template-columns:repeat(4,1fr);row-gap:12px}.timeline:before{display:none}}@media(max-width:480px){.top{padding:0 14px}.workspace{display:none}main{padding:18px 14px 95px}.title{font-size:21px}.timeline{grid-template-columns:repeat(4,minmax(0,1fr))}.step{font-size:10px}.switcher span{min-width:190px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand">Deep Research <span class="tag">交互原型</span></div><div class="workspace">研究工作区　/　执行看板</div></header>
<div class="layout">
<main>
<div class="kicker">研究运行 · 业务视图</div>
<h1 class="title">明年是否进入东南亚市场？</h1>
<p class="sub">决策支持：是否试点　·　期望决策时间：本季度　·　最近更新：刚刚</p>
<div id="stateSummary" class="summary"></div>
<div id="timeline" class="timeline"></div>
<div id="narrative"></div>
<section class="section"><h2 id="sectionTitle">当前工作</h2><div id="workItems" class="checklist"></div><div id="freePlay" class="actions"></div></section>
<section id="correction" class="section hidden"></section>
<section class="section"><h2>最近发生</h2><div id="feed" class="feed"></div></section>
<p class="annotation">演示数据。真实版本中，当前阶段与纠偏可执行动作必须由 run 文件、journal 和 HITL 事实推导；不得把“发现问题”按钮伪装成已写入研究方向。</p><div class="actions"><button class="button" onclick="dispatch('reset')">重置本方案</button></div>
</main>
<aside class="side">
<h2 id="sideTitle">这次研究要支持的决定</h2>
<div id="sideContent"></div>
<div class="box"><span class="kicker">尚未确认</span><p id="unknownBudget">试点预算上限</p></div>
<div class="box"><span class="kicker">交付</span><p>一页决策摘要 + 关键依据与限制</p></div>
<div class="gate"><b>方向变更有记录</b>立项已确认后，新增信息先作为补充提交。需要改变研究范围时，由负责人在阶段审阅时确认并写入研究记录。</div>
</aside>
</div>
</div>
<div class="switcher" role="group" aria-label="原型方案切换"><button id="prev" aria-label="上一方案">‹</button><span id="variantName"></span><button id="next" aria-label="下一方案">›</button></div>
<script>
// Question: does a business-first wait view plus explicit, auditable correction routes make progress and intervention understandable without inventing mid-run approvals?
const variants=[{id:'A',name:'进度解释线'},{id:'B',name:'决策门与下一步'},{id:'C',name:'异常处理与回路'}];
const base={stage:'research',issue:false,extra:false,feedback:false,revision:'',logs:['团队已分配研究主题：市场需求、准入、渠道成本。','已取得 4 份来源材料；材料数量不代表结论完成。'],approved:true};let state={...base,logs:[...base.logs]};let variant='A';
const stages=[['立项','分解为必须回答的问题'],['组队','按问题分派研究'],['侦察','寻找权威线索'],['核实','抓取与交叉核对'],['综合','形成结论与缺口'],['审查','寻找反证与遗漏'],['交付','提交报告供你审阅']];
function log(s){state.logs.unshift(s)}
function dispatch(action){switch(action){case'issue':state.issue=true;log('发现待处理事项：预算口径缺失，可能影响盈亏比较。');break;case'submit':state.extra=true;state.revision=document.querySelector('#extraText').value||'请把预算上限补充进研究范围';state.issue=false;log('补充已提交给研究负责人；研究记录标记为待核对，未自动改写已批准方向。');break;case'accept':state.extra=false;state.feedback=true;state.stage='synthesis';log('负责人确认补充不改变已批准范围，已写入研究工作记录并继续综合。');break;case'scope':state.extra=false;state.feedback=true;state.stage='review';log('补充会改变比较范围：列入下一阶段审阅，等待负责人记录范围决定；未自动开始新方向。');break;case'quality':state.issue=true;state.stage='review';log('对抗审查发现结论需要复核，研究停在审查，不把质量问题伪装成用户方向选择。');break;case'advance':state.stage=state.stage==='research'?'synthesis':state.stage==='synthesis'?'review':'done';state.issue=false;log('研究推进到'+state.stage+'；状态变化以已有研究文件和审查结果为依据。');break;case'wait':state.stage='research';state.issue=false;log('团队继续自主研究；暂时没有需要你处理的事项。');break;case'approve':state.stage='done';state.feedback=false;log('你在交付审阅中选择定稿；决定已记录，报告交付。');break;case'more':state.stage='research';state.feedback=false;log('你在交付审阅中选择补研究；按决定重入挖掘，新增证据将记为下一版本。');break;case'rewrite':state.stage='done';state.feedback=false;log('你在交付审阅中选择修订表述；原位修订，不改变证据版本。');break;case'reset':state={...base,logs:[...base.logs]};break}render()}
function content(){let i=stages.findIndex(x=>x[0]===state.stage);if(state.stage==='done')i=6;if(state.stage==='review')i=5;if(state.stage==='synthesis')i=4;return {i}}
function render(){const {i}=content();const summary=document.querySelector('#stateSummary');const wait=state.stage!=='done';summary.innerHTML=`<div class="summary-head"><span class="dot ${state.issue?'issue':state.feedback?'':'wait'}"></span>${state.stage==='done'?'报告已准备好':state.issue?'需要核对一项输入':state.feedback?'补充已进入研究记录':'团队正在核对市场准入与盈亏依据'}</div><p>${variant==='B'?'当前：综合已核实的市场与准入资料，判断哪些差异会改变试点选择。接下来：对抗审查，然后由你审阅交付。':variant==='C'?'发现待处理事项：预算假设缺少证据。先补业务事实并说明来源；负责人会判断其影响并把处理结果记入研究记录。':state.issue?'预算上限缺失会影响试点与全面进入的比较。你可以补充信息；是否改变范围会先经负责人确认。':state.feedback?'补充已记录。方向无需改变，团队继续综合；任何会改变范围的决定都要在阶段审阅处记账。':state.stage==='done'?'请审阅报告中的建议、依据、最大未知和适用条件。':'已完成资料收集的一部分，当前在核实关键口径；研究结论尚未完成。下次需要你决定时会在这里标出。'}</p>`;
 document.querySelector('#timeline').innerHTML=stages.map(([n,d],j)=>`<div class="step ${j<i?'done':j===i?'current':''} ${state.issue&&j===3?'attn':''}">${n}</div>`).join('');
 const nar=document.querySelector('#narrative');nar.className='narrative '+(state.issue?'warn':state.stage==='done'?'':'');nar.innerHTML=state.issue?'<strong>为什么停在这里</strong>预算口径会改变盈亏判断，目前材料不足以比较选项。<br>请补充预算，或说明“暂不确定”；负责人会判断它是否改变已批准范围。':state.feedback?'<strong>你已补充，当前无需再操作</strong>研究团队正在把新信息与原问题核对。若信息改变研究范围，会在交付审阅或明确的阶段决策中展示影响后再处理。':'<strong>'+(state.stage==='done'?'请你审阅交付':'你现在不需要做什么')+'</strong>'+(state.stage==='done'?'团队已完成本轮研究，并通过对抗审查。': '团队在后台推进。只有需要你补充业务事实、确认方向或审阅交付时才会打断你。');
 document.querySelector('#sectionTitle').textContent=state.stage==='done'?'交付审阅':state.issue?'需要你补充的信息':state.feedback?'补充处理进度':'当前阶段：'+stages[i][0];
 const items=state.stage==='done'?[['建议与适用条件','待审阅'],['最强依据与反证','待审阅'],['未能判断的事项','待审阅']]:state.issue?[['预算上限','缺失，影响盈亏比较'],['市场需求和准入','核对中']]:[['市场需求','已形成初步发现'],['准入要求','交叉核验中'],['盈亏约束','等待预算口径']];
 document.querySelector('#workItems').innerHTML=items.map((x,j)=>`<div class="row"><div><b>${x[0]}</b><br><small>${j===0&&state.issue?'请提供数值、范围或标记暂不确定':j===0?'关联业务问题，不等于已形成结论':'来源与结论分别核对'}</small></div><span class="status ${state.issue&&j===0?'warn':''}">${x[1]}</span></div>`).join('');
 const free=document.querySelector('#freePlay');free.innerHTML=state.issue?'<button class="button" onclick="dispatch(\'wait\')">继续研究，暂不处理</button>':state.stage==='done'?'<button class="button" onclick="dispatch(\'reset\')">重看等候流程</button>':'<button class="button" onclick="dispatch(\'advance\')">演示下一阶段</button><button class="button" onclick="dispatch(\'issue\')">模拟发现缺少业务信息</button><button class="button" onclick="dispatch(\'quality\')">模拟审查发现问题</button>';const corr=document.querySelector('#correction');corr.classList.toggle('hidden',!state.issue&&!state.extra&&state.stage!=='done');if(state.issue){corr.innerHTML=`<h2>补充业务信息</h2><div class="issue-card"><h3>试点预算上限是多少？</h3><p>不确定也可以说明。提交后先由负责人核对是否改变研究范围，不会静默覆盖原问题。</p><label for="extraText">你的补充</label><textarea id="extraText" placeholder="例如：首年试点预算不超过 200 万；币种人民币"></textarea><div class="actions"><button class="button primary" onclick="dispatch('submit')">提交补充</button><button class="button" onclick="dispatch('issue')">暂时跳过</button></div></div>`}else if(state.stage==='done'){corr.innerHTML='<h2>交付审阅 · 选择下一步</h2><div class="actions"><button class="button primary" onclick="dispatch(\'approve\')">定稿并交付</button><button class="button" onclick="dispatch(\'more\')">补充研究</button><button class="button" onclick="dispatch(\'rewrite\')">修订表述</button></div><p class="annotation">补充研究会产生新版本；修订表述不改变证据版本。选择会写入决定记录。</p>'}else if(state.extra){corr.innerHTML=`<h2>负责人已处理补充</h2><div class="issue-card"><p>收到：“${state.revision}”</p><p>这条信息是否改变原先批准的范围？</p><div class="actions"><button class="button primary" onclick="dispatch('accept')">不改变范围，纳入核对</button><button class="button" onclick="dispatch('scope')">改变范围，列入阶段审阅</button></div></div>`}
 document.querySelector('#feed').innerHTML=state.logs.slice(0,5).map(x=>`<div class="event"><span class="eicon">•</span><span>${x}</span></div>`).join('');document.querySelector('#sideTitle').textContent=variant==='A'?'这次研究要支持的决定':variant==='B'?'下一步与决策门':'问题处理路径';document.querySelector('#sideContent').innerHTML=variant==='A'?'<div class="box"><span class="kicker">决策问题</span><p>是否在明年试点进入东南亚市场</p></div><div class="box"><span class="kicker">比较选项</span><p>进入 / 小规模试点 / 暂缓</p></div><div class="box"><span class="kicker">必须弄清</span><p>市场需求、准入要求、渠道成本、盈亏约束</p></div><div class="box"><span class="kicker">交付</span><p>一页决策摘要 + 关键依据与限制</p></div>':variant==='B'?'<div class="phase-detail"><span class="phase-no">当前</span><p>综合已核实的市场与准入材料，找出对“进入/试点/暂缓”选择有影响的差异。</p></div><div class="box"><span class="phase-no">之后</span><p>对抗审查 → 交付审阅。只有交付审阅需要你拍板。</p></div><div class="box"><span class="phase-no">你现在</span><p>不需要操作。若资料不足，研究会明确标记缺口，不假装完成。</p></div>':'<div class="box"><span class="kicker">发现问题</span><p>补充业务事实 → 负责人判断影响 → 记录结论</p></div><div class="box"><span class="kicker">只影响证据/表述</span><p>修复并复核，不打断你。</p></div><div class="box"><span class="kicker">改变研究方向</span><p>在交付审阅或明确决策点拍板并记账；HITL1 不重开。</p></div><div class="gate"><b>范围变更不会静默执行</b>若结构性改变问题，应另起研究 run，不混写既有版本。</div>';document.querySelector('#variantName').textContent=`${variant} · ${variants.find(x=>x.id===variant).name}`;document.querySelector('#unknownBudget').textContent=state.issue?'缺失，需补充或注明未知':'尚未提供；团队会显性标注其影响';}
function selectVariant(id){variant=id;history.replaceState(null,'',`?variant=${id}`);state={...base,stage:'research',issue:false,extra:false,feedback:false,logs:[...base.logs]};if(id==='B')state.stage='synthesis';if(id==='C'){state.stage='review';state.issue=true;state.logs.unshift('审查指出预算假设缺少证据，需要处理。')}render()}
function cycle(delta){let i=variants.findIndex(x=>x.id===variant);selectVariant(variants[(i+delta+variants.length)%variants.length].id)}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input,select,[contenteditable=true]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
const params=new URLSearchParams(location.search);variant=params.get('variant')||'A';if(!variants.some(x=>x.id===variant))variant='A';selectVariant(variant);
</script>
</body>
</html>
