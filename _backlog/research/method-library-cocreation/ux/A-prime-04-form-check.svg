<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><style>text{font-family:Arial,"PingFang SC","Hiragino Sans GB",sans-serif}.t{fill:#edf1f3}.m{fill:#a8b2b6}.s{font-size:12px}.b{font-size:14px}.h{font-size:20px;font-weight:700}.sh{font-size:15px;font-weight:700}</style></defs>
  <rect width="1440" height="900" fill="#101214"/><rect width="220" height="900" fill="#15181a"/><line x1="220" y1="0" x2="220" y2="900" stroke="#30373a"/>
  <text x="18" y="31" class="t" font-size="16" font-weight="700">◆ Orca</text><text x="18" y="59" class="m s">工作区</text><text x="30" y="96" class="m b">研究工作区</text><text x="18" y="145" class="m s">方法库</text><rect x="17" y="164" width="190" height="48" rx="5" fill="#1d2828" stroke="#6ea391"/><text x="30" y="187" class="t b">选型评估方法</text><text x="30" y="203" class="m s">活动草稿 · 未保存</text><text x="30" y="251" class="m b">格局调研</text><text x="30" y="283" class="m b">内置参考</text>
  <text x="252" y="31" class="t b">中美编程人数差异</text><text x="252" y="57" class="m s">Chat　　 Trajectory　　 <tspan fill="#7daff0">方法库</tspan></text><line x1="250" y1="76" x2="1410" y2="76" stroke="#30373a"/>
  <rect x="240" y="98" width="1170" height="766" rx="7" fill="#15191b" stroke="#343d41"/><text x="266" y="135" class="t h">检查选型评估方法</text><text x="266" y="162" class="m b">同一份活动草稿 · 可以直接修改，返回后继续对话</text><rect x="1252" y="115" width="132" height="32" rx="5" fill="#22292b" stroke="#465156"/><text x="1318" y="136" text-anchor="middle" class="t s">返回访谈</text><line x1="266" y1="183" x2="1384" y2="183" stroke="#343d41"/>
  <text x="266" y="212" class="m s">名称</text><rect x="266" y="224" width="1118" height="42" rx="4" fill="#101416" stroke="#404a4e"/><text x="282" y="251" class="t b">选型评估方法</text><text x="1300" y="251" text-anchor="end" class="m s">改名建议按“另存为新方法”处理</text>
  <text x="266" y="300" class="m s">找来源　<tspan fill="#8ed0bd">来自对话</tspan></text><rect x="266" y="312" width="1118" height="68" rx="4" fill="#101416" stroke="#404a4e"/><text x="282" y="341" class="t b">官方定价页与文档优先；媒体只作线索，厂商口径按时间并列。</text><text x="282" y="364" class="m s">来源消息：方法编辑第 3 轮　·　查看对话可回到原回答</text>
  <text x="266" y="414" class="m s">怎么核实　<tspan fill="#efce8c">我改过 · 方法编辑暂不覆盖</tspan></text><rect x="266" y="426" width="1118" height="74" rx="4" fill="#171817" stroke="#a3824e"/><text x="282" y="455" class="t b">关键数字回原表复算；口径不一致时并列，不合成单一数字。</text><rect x="1128" y="462" width="238" height="25" rx="4" fill="#29251e" stroke="#816b42"/><text x="1247" y="479" text-anchor="middle" fill="#efce8c" class="s">让方法编辑继续处理此字段</text>
  <text x="266" y="535" class="m s">报告怎么写　<tspan fill="#8ed0bd">来自对话</tspan></text><rect x="266" y="547" width="1118" height="68" rx="4" fill="#101416" stroke="#404a4e"/><text x="282" y="576" class="t b">先给结论、适用条件与风险，再按方案拆分对照。</text><text x="282" y="599" class="m s">来源消息：方法编辑第 5 轮</text>
  <text x="266" y="649" class="m s">不承诺　<tspan fill="#a8b2b6">待定</tspan></text><rect x="266" y="661" width="1118" height="54" rx="4" fill="#101416" stroke="#404a4e" stroke-dasharray="4 4"/><text x="282" y="693" class="m b">填写明确不做什么，或返回访谈继续讨论</text>
  <text x="266" y="752" class="m s">默认偏好是库级唯一状态；是否独立于方法保存，待裁定</text><text x="266" y="790" class="m s">研究打法 3/4 · 名称已定 · 保存不可用：请填写「不承诺」</text><line x1="266" y1="811" x2="1384" y2="811" stroke="#343d41"/>
  <rect x="1092" y="824" width="132" height="32" rx="5" fill="#22292b" stroke="#465156"/><text x="1158" y="845" text-anchor="middle" class="t s">返回访谈</text><rect x="1236" y="824" width="148" height="32" rx="5" fill="#22292b" stroke="#465156"/><text x="1310" y="845" text-anchor="middle" class="m b">保存到方法库</text>
</svg>
