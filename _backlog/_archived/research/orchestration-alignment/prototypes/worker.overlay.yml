# Phase 2 prototype overlay（只住 _backlog，不并入 pack）。
# 两个非研究角色的 worker profile：
#   research-worker = 叶子 worker：取证/写卡/检索/技能，无 team/goal/ask/present/subagent/workflow
#   research-wave   = 同质扇出 executor：叶子 + workflow engine/tool；child 继承此薄组合
# 目的：keyless 证明 mount / skills/list 可见；真模型工具面由 Phase 3 探针读 request/header。
- insert:
    - id: preset-research-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: research-worker
        name: Research Worker
        description: 研究执行 worker（非研究角色）——只做指派的取证/写卡/检索，不组队、不问人、不设目标
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是研究执行 worker（不是研究角色、不是 Lead）。只做 brief 指派的一个 cell：取证、检索、写卡、对账；不组队、不问用户、不设 goal、不声明交付。
                需要拍板或超出 brief 的事，写成 gap 回给派发者；不要自己扩大范围。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-deep-research-pack/package.json')), 'presets/analyst/skills')
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-deep-research-pack/package.json')), 'presets/critic/skills')
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
              fetchTimeoutMs: 45000
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 22528
              projectRootMarkers: []

    - id: preset-research-wave
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: research-wave
        name: Research Wave Executor
        description: 同质取证 wave 的执行器（非研究角色）——固定配方扇出，不综合、不组队、不问人
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是同质取证 wave 的执行器（不是 Lead、不是研究角色）。只按 brief 与固定配方跑一个 wave；不综合、不写 final/review、不组队、不问用户、不设 goal。
                child 继承你的薄组合；它们只做单 cell 取证。需要拍板的事写 gap 回给 Lead。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-deep-research-pack/package.json')), 'presets/analyst/skills')
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-deep-research-pack/package.json')), 'presets/critic/skills')
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
              fetchTimeoutMs: 45000
          - id: workflow-delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
                  maxConcurrentAgents: 4
                  maxTotalAgents: 8
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                config:
                  enableRunInBackground: false
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 22528
              projectRootMarkers: []
