0" stroke-width="1"/><text x="344" y="222" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#5f5f68" text-anchor="start" font-weight="400" opacity="1">找来源</text><rect x="852" y="196" width="500" height="42" rx="5" fill="none" stroke="#2a2a30" stroke-width="1"/><text x="344" y="222" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#5f5f68" text-anchor="start" font-weight="400" opacity="1">怎么核实</text><rect x="332" y="250" width="500" height="42" rx="5" fill="none" stroke="#2a2a30" stroke-width="1"/><text x="344" y="276" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#5f5f68" text-anchor="start" font-weight="400" opacity="1">报告怎么写</text><rect x="852" y="250" width="500" height="42" rx="5" fill="none" stroke="#2a2a30" stroke-width="1"/><text x="344" y="276" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#5f5f68" text-anchor="start" font-weight="400" opacity="1">不承诺</text><text x="332" y="344" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#4f8cff" text-anchor="start" font-weight="400" opacity="1">[展开表单] → 全表单自滚；[回到对话] → 回卡片</text><rect x="316" y="400" width="1052" height="324" rx="8" fill="#17171a" stroke="#2a2a30" stroke-width="1"/><text x="332" y="424" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="12" fill="#e8e8ec" text-anchor="start" font-weight="600" opacity="1">对话区：自滚 + 自动贴底</text><text x="332" y="444" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">默认贴底；用户上翻暂停；新消息出胶囊；点胶囊回底</text><rect x="332" y="470" width="700" height="32" rx="6" fill="#1d1d21" stroke="#2a2a30" stroke-width="1"/><text x="344" y="490" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">消息 1</text><rect x="332" y="510" width="700" height="32" rx="6" fill="#1d1d21" stroke="#2a2a30" stroke-width="1"/><text x="344" y="530" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">消息 2</text><rect x="332" y="550" width="700" height="32" rx="6" fill="#1d1d21" stroke="#2a2a30" stroke-width="1"/><text x="344" y="570" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">消息 3</text><rect x="332" y="590" width="700" height="32" rx="6" fill="#1d1d21" stroke="#2a2a30" stroke-width="1"/><text x="344" y="610" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">消息 4</text><rect x="332" y="630" width="700" height="32" rx="6" fill="#1d1d21" stroke="#2a2a30" stroke-width="1"/><text x="344" y="650" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">消息 5</text><rect x="1348" y="400" width="3" height="324" rx="0" fill="none" stroke="#4f8cff" stroke-width="1"/><rect x="760" y="446" width="190" height="26" rx="13" fill="#4f8cff" stroke="#4f8cff" stroke-width="1"/><text x="780" y="464" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="start" font-weight="400" opacity="1">↓ 2 条新消息 · 回到最新</text><rect x="332" y="690" width="1052" height="30" rx="6" fill="#1d1d21" stroke="#2a2a30" stroke-width="1"/><text x="344" y="710" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#5f5f68" text-anchor="start" font-weight="400" opacity="1">Message…</text><line x1="832" y1="196" x2="840" y2="470" stroke="#3ecf8e" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="840" y1="470" x2="832" y2="196" stroke="#3ecf8e" stroke-width="1.6" stroke-dasharray="4 4"/><text x="850" y="300" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#3ecf8e" text-anchor="start" font-weight="400" opacity="1">「来自对话」↔ 产出消息</text><text x="316" y="776" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#5f5f68" text-anchor="start" font-weight="400" opacity="1">注：窗口再窄也只压缩左右宽度，不产生整页滚动；对话输入框始终贴底。</text></svg>