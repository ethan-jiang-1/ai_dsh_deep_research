<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#0f0f10"/><text x="24" y="34" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="15" fill="#e8e8ec" text-anchor="start" font-weight="600" opacity="1">方案 A · 滚动解剖：页面不滚；卡不滚（收起）/ 全表单自滚；对话自滚并跟随最新</text><text x="24" y="56" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="11" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">灰 = 可见区域；蓝 = 滚动条；虚线 = 字段 ↔ 消息的可追溯跳转</text><rect x="40" y="80" width="1360" height="760" rx="10" fill="none" stroke="#2a2a30" stroke-width="1"/><text x="56" y="104" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="11" fill="#4f8cff" text-anchor="start" font-weight="400" opacity="1">[data-method-library]  height:100%  overflow:hidden  ← 页面永不滚</text><rect x="56" y="120" width="200" height="620" rx="8" fill="#17171a" stroke="#2a2a30" stroke-width="1"/><text x="72" y="144" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="11" fill="#e8e8ec" text-anchor="start" font-weight="500" opacity="1">我的库 / 内置参考</text><text x="72" y="164" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#5f5f68" text-anchor="start" font-weight="400" opacity="1">搜索…</text><rect x="68" y="180" width="176" height="54" rx="5" fill="none" stroke="#2a2a30" stroke-width="1"/><text x="80" y="204" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">条目 1</text><rect x="68" y="244" width="176" height="54" rx="5" fill="none" stroke="#2a2a30" stroke-width="1"/><text x="80" y="268" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">条目 2</text><rect x="68" y="308" width="176" height="54" rx="5" fill="none" stroke="#2a2a30" 