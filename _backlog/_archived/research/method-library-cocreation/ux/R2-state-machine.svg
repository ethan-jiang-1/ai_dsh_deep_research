e="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">· 手改集合 / coach 字段集合 / active</text><text x="920" y="236" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">· 库文本 / 加载态 / 错误</text><text x="920" y="266" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">· coach 会话 id / 历史（不重建）</text><text x="920" y="296" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">· 对话 scrollTop / 卡 scrollTop</text><text x="920" y="326" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">· 保存/删除待处理 ref</text><text x="920" y="356" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="10" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">· 未保存脏标记（切换前确认）</text><rect x="900" y="560" width="470" height="180" rx="10" fill="#17171a" stroke="#2a2a30" stroke-width="1"/><text x="920" y="586" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="12" fill="#e8e8ec" text-anchor="start" font-weight="600" opacity="1">切换规则（摘要）</text><text x="920" y="612" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">· 卡→全表单：焦点=active；对话记 scrollTop</text><text x="920" y="636" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">· 全表单→卡：同一 draft，不重复保存</text><text x="920" y="660" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">· 读→编辑：装入 draft，清空手改</text><text x="920" y="684" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">· 选另一条：有未保存先确认</text><text x="920" y="708" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#8b8b94" text-anchor="start" font-weight="400" opacity="1">· A/B 切换：同一个 MethodCoachPanel，只换容器</text></svg>