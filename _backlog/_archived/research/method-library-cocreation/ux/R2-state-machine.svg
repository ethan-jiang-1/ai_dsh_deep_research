<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#0f0f10"/><text x="24" y="34" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="15" fill="#e8e8ec" text-anchor="start" font-weight="600" opacity="1">方案 A · 模式与状态机：切换只改视图，draft/会话/滚动位置不重建</text><rect x="80" y="120" width="220" height="86" rx="10" fill="#1d1d21" stroke="#4f8cff" stroke-width="1"/><text x="190.0" y="146" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="12" fill="#e8e8ec" text-anchor="middle" font-weight="600" opacity="1">新建 · 草稿卡</text><text x="190.0" y="164" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#8b8b94" text-anchor="middle" font-weight="400" opacity="1">默认：卡 + 对话（起手式）</text><rect x="80" y="300" width="220" height="86" rx="10" fill="#1d1d21" stroke="#4f8cff" stroke-width="1"/><text x="190.0" y="326" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="12" fill="#e8e8ec" text-anchor="middle" font-weight="600" opacity="1">新建 · 全表单</text><text x="190.0" y="344" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#8b8b94" text-anchor="middle" font-weight="400" opacity="1">卡隐藏；对话收起</text><rect x="80" y="480" width="220" height="86" rx="10" fill="#1d1d21" stroke="#3ecf8e" stroke-width="1"/><text x="190.0" y="506" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="12" fill="#e8e8ec" text-anchor="middle" font-weight="600" opacity="1">读态</text><text x="190.0" y="524" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="9.5" fill="#8b8b94" text-anchor="middle" font-weight="400" opacity="1">只读卡；对话收起</text><rect x="80" y="660" width="220" height="86" rx="10" fill="#1d1d21" stroke="#3ecf8e" stroke-width="1"/><text x="190.0" y="686" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="12" fill="#e8