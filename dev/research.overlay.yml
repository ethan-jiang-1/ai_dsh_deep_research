          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              maxDepth: 2
              allowedAgentPresets:
                - scout
                - analyst
                - critic

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 22528
              projectRootMarkers: []

    # ── method-editor.patch.yml（由 dev/render-overlay.mjs 从 pack 渲染）──
    - id: preset-method-editor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: method-editor
        name: Method Editor
        description: 方法库页的方法编辑——一次一问，把研究方法聊成四字段库条目；不做研究、不检索、不组队
        order: 9
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「方法编辑」——方法库页右侧的共创者，不是研究者，也不是 Lead。
                你唯一的产物：把用户脑子里的研究方法聊成一条四字段库条目（找来源 / 怎么核实 / 报告怎么写 / 不承诺），
                并让页面表单随对话逐格成形。

                硬规则（违反即失职）：
                - 不做研究：不检索、不读 run bundle、不组队、不写报告；不调用 web / fs / subagent / session-query。
                  你只做方法访谈。用户问研究问题，只回答“这属于研究，去主对话问 Lead”。
                - 一次一问：每轮最多一个 ask_user_question，给 2–4 个具体选项；用户答完再问下一个。不要一次抛四问。
                - 先场景后字段：先问“这条方法用来做什么研究 / 交付给谁”；再问来源、核实、报告、不承诺；名称最后和用户定。
                - 不知道是合法答案：用户说“不知道 / 没想过”时，给一个能起步的最小答案让他挑，不替他编来源、口径或承诺。
                - 不承诺至少一条：问清这条方法明确不做什么（禁用的来源类型 / 不做的推断 / 不承诺的精度）。
                - 以页面给的库快照为准：新建还是更新、有没有撞名；不覆盖别人条目；内置参考只用于对照，不照抄。
                - 先加载 method-interview skill，按它的四字段判据、选项集和转换模式来问。

                输出契约：每当字段有变化，在消息末尾给一个 ```method-draft 围栏，内容是**完整**库条目（不是 diff），
                格式见 method-interview skill。没有变化就不发。页面会用它回填表单；用户手改后以用户为准。
                保存由页面按钮触发；收到【保存封套】时调 method_library_upsert 写库，成功后只回复「已写入：<名称>」，不要做其它事。

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-deep-research-pack/package.json')), 'presets/method-editor/skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # blocking = 默认 legacy 模式：用户不答，回合不落定（方法库页在等这一问）。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # 写库唯一路径（D25）：方法编辑只通过这个窄工具碰 method-library.md；面板不直写。
          - id: method-library-tool
            name: 'dsh-deep-research-pack/method-library-tool'

          # 工作区手册注入（handbook-budget 门禁）：给方法与库格式的参考上下文，按预算截断。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 22528
              projectRootMarkers: []

    # ── scout.patch.yml（由 dev/render-overlay.mjs 从 pack 渲染）──
    - id: preset-scout
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: scout
        name: Deep Research Scout
        description: 广度侦察——query 多样化、来源发现与质量分级、候选方向图；只指路，不下结论
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是这支 Deep Research 团队的侦察员（Scout）——广度是你的领地，深度不是。你的产出决定团队往哪儿挖，挖错方向的成本全队承担。
                接到任务先加载 lead-mapping skill。
                你的视角只有三件事：候选方向（lead）、来源发现、来源质量分级。
                搜索纪律（信噪比处置）：query 多样化——同一概念换同义词、换语言、换行话各搜一轮；每条来源 30 秒内判去留（读标题+摘要+出处，不值得就丢）；找不到的方向显式记"已排除+原因"，不静默放弃。
                质量分级（写进 leads.md 每条的 quality 字段，判**内容质量**）：A=关键事实完整且口径明确；B=可靠但覆盖/口径有缺；C=侧证或口径不明；D=未验证/孤证。信源身份另记 source_tier（primary/secondary/tertiary/weak，判据表在研究手册）——quality 与 tier 两维独立评级。关键结论只能由 A/B 支撑；D 默认弃用，除非它是唯一来源且标注"待验证"。
                产出形态：本 run bundle（drt_<slug>/）的 leads.md——候选方向清单（每个方向：一句话假设 + 支持来源 + 分级 + 建议挖深/排除），完成后通过团队通道向主编汇报。
                边界：你不下结论、不写报告正文、不做深度挖掘——那是 Analyst 与主编的事。你发现的每条线索都要可回溯：来源 URL 必须真实抓取过，禁止凭记忆编 URL。
                需要并行铺开多个方向时用 subagent 生 worker：给清晰 brief（方向 + 判去留标准 + 质量分级规则），汇总后署你自己的分级。
                研究手册（会话 cwd 根的 AGENTS.md）已自动注入本会话，目录约定与 owner 表以它为准。
                开工动作：先读本 bundle 的 question.md 与 topics.md。

          # 时钟（DSH 原生 time-context）：每步注入一条可追溯的当前时间读数。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-deep-research-pack/package.json')), 'presets/scout/skills')

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
              fetchTimeoutMs: 45000

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              maxDepth: 2
              allowedAgentPresets:
                - scout
                - analyst
                - critic

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 22528
              projectRootMarkers: []

    # ── cordis.patch.yml 的 bundle 级 insert 行（由 dev/render-overlay.mjs 直读，镜像同源）──
    # ── 抓取回退 provider（D31）：本地 web-fetch-http → DeepSeek Fetch API。注册 id =
    #    deepseek-fallback-fetch（上方 web 行钉它）；无 DEEPSEEK_API_KEY 时只走本地、
    #    错误里如实标 fallback unavailable。config.enabled: false = 只走本地（无需改 selection）。──
    - id: research-fetch-fallback
      name: dsh-deep-research-pack/fetch-fallback
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        localTimeoutMs: 10000
        totalBudgetMs: 28000
    # ── web 工具：**insert** 不在此声明。实证结论（RFC web-tool-rows）：web seam /
    #    web-search-deepseek / web-deepseek-api / web-fetch-http / tool-web 全部是 dsh-base 出厂行——
    #    providers 与 seam 留在 host 面，模型面 tool-web 行随各 preset 声明。此处 insert 反而
    #    会与 surface 的 preset-scoping 设计打架。选择面 = 上方 `- id: web` 替换行（D30/D31）。──
    # ── 交付物声明工具（base 无此行；host 面注册。lead 的工具授权另在 lead.patch.yml
    #    plugins 自包含声明——preset 层与 bundle 层分工，非 D16 同层重复行）──
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
    # ── 团队机制行（agent-team / tool-agent-team）不在此声明（RFC m2-p1-run-channel A 定案）：
    #    组合归 vendor agent-team-profile 层（profile 装 @…-agent-team-profile）——行带实战 config
    #    与 company D18 机械禁令（control / list-agents 禁用、subagent 强制 one-shot）。──
    # ── 团队 Web 可视面（观察与调试任务起止的最简途径；vendor 层无此行，仍归本包）──
    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
    # ── 本包自己的 client 面（D18 单点例外）：host 半是空壳，浏览器半注册右栏「研究状态」
    #    页签。行的 name 就是本包名（company-pack 同款）——host 侧加载 lib/index.js（空壳），
    #    浏览器侧经 exports["./client"] 取 lib/client.js（ModuleLoader 外壳）。──
    - id: research-client
      name: 'dsh-deep-research-pack'
