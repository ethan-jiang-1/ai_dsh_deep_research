# research.overlay.yml — 源码域实验 overlay（preset-smoke 真挂载用）
# 机制（company dev/company.overlay.yml 同款）：`--profile web --patch <本文件绝对路径>`
# 在 profile 层之后追加本 overlay——行包名在 vendor 源码工作区解析（boot 进程必须起自
# company checkout，tsx/esm 从其 node_modules 解析），零安装混线。
# ⚠ 本文件里的路径一律**绝对路径**：boot cwd = company checkout（tsx 解析所需），
#   相对路径会指进 company 树——company overlay 用相对路径是因为它 boot 自家根。
# 语法：web-app bundle 已 insert agent-presets 行（default: standard）→ 本 overlay 用**替换**
# 语法换成本包 roster；tool-present / ui-agent-team web profile 缺席 → insert。
# （镜像 cordis.patch.yml 的行集合。团队机制行 agent-team / tool-agent-team 归 vendor
#  agent-team-profile 层——安装域随 profile 装载（RFC m2-p1-run-channel A 定案）；源码域
#  boot 无团队面，preset 迭代不需要。web 行不在此，实证归 base。）
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: lead
    roots:
      - path: /Users/bowhead/ai_dsh_deep_research/packages/deep-research-pack/presets/
        trust: system
- insert:
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
