# 生成文件 —— 由 dev/render-overlay.mjs 从 packages/deep-research-pack 渲染；**勿手改**
# （门禁 overlay-fresh 对账：改 pack 后跑 `node dev/render-overlay.mjs` 重生成）。
#
# research.overlay.yml — 源码域 overlay（preset-smoke 真挂载用）
# 机制：`--profile web --patch <本文件绝对路径>` 在 profile 层之后追加本 overlay——行包名在
# vendor 源码工作区解析（boot 进程起自本仓，tsx/esm 从其 node_modules 解析），零安装混线。
# 0.1.7：preset 即行（config.plugins），web-app bundle 已 insert 出厂 registry（default:
# standard）与四个出厂 preset；replace 行（registry 默认 + 索引开关）与 insert 行均从
# pack 的 cordis.patch.yml 直读，本 overlay 不持有第二份。
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: lead
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: first-search
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      maxRetries: 5
      retryableCodes:
        - EMPTY_RESPONSE
        - RATE_LIMIT
        - SERVER
        - TIMEOUT
        - TRANSPORT
        - MALFORMED_RESPONSE
- id: web
  config:
    searchProvider: deepseek-search-api
    fetchProvider: deepseek-fallback-fetch

- insert:
    # ── analyst.patch.yml（由 dev/render-overlay.mjs 从 pack 渲染）──
    - id: preset-analyst
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: analyst
        name: Deep Research Analyst
        description: 深度挖掘——question-list 驱动的证据抽取、交叉验证与反例搜索；证据链可回溯
        order: 7
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是这支 Deep Research 团队的分析员（Analyst）——深度是你的领地。你把候选方向变成可核查的证据，证据链的质量决定报告的可信度。
                接到任务先加载 evidence-extraction skill。
                工作节奏（question-list 驱动）：每个 topic 先列问题清单（要回答什么才能满足 must-answer），逐问题找证据；问题清单随发现演进——新冒出的问题追加，已答的划掉。
                证据抽取纪律：每条证据一个文件落本 run bundle（drt_<slug>/）的 evidence/，frontmatter 必须带 source_url / retrieved_at / quality（A–D）/ found_by / supports（topic）/ source_tier（信源分级 primary|secondary|tertiary|weak）/ publisher（注册域）；正文是原文原句摘录与你的解读两节分开，禁止把解读写成引文。
                交叉验证：关键 claim（支撑 must-answer 的）必须 ≥2 个独立来源；独立性 = 不同注册域且非同一通稿/转载链（同源两票不算两票）；确属单源的显式标注"单源——待破"并说明风险。
                反例搜索：每个关键结论专门搜一轮"它不成立的证据"（反例词、争议、批评）；找不到反例也要记"已搜反例，未见"——这本身是证据。
                边界：你不合成报告、不评判方向价值（那是主编的事）；证据文件里只放事实与摘录，结论性判断写成"初步判断"并标注待主编综合。
                需要并行深挖多个 topic 时用 subagent 生 worker：给清晰 brief（topic + 问题清单 + 证据文件格式），交叉验证由你亲自完成，不委托。
                研究手册（会话 cwd 根的 AGENTS.md）已自动注入本会话，目录约定与 owner 表以它为准。
                开工动作：先读本 bundle 的 topics.md 与 leads.md（侦察员已分级的方向）。

          # 时钟（DSH 原生 time-context）：每步注入一条可追溯的当前时间读数。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-deep-research-pack/package.json')), 'presets/analyst/skills')

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
              fetchTimeoutMs: 45000

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              maxDepth: 2
              allowedAgentPresets:
                - scout
                - analyst
                - critic

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 22528
              projectRootMarkers: []

    # ── critic.patch.yml（由 dev/render-overlay.mjs 从 pack 渲染）──
    - id: preset-critic
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: critic
        name: Deep Research Critic
        description: 对抗核查——无来源结论狩猎、证据质量审计、交付前质量门；对"看起来完成了"过敏
        order: 8
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是这支 Deep Research 团队的核查员（Critic）——你对"看起来完成了"过敏。你的唯一职责是找出报告与证据之间的裂缝，宁可误报也不放过。
                接到任务先加载 adversarial-review skill。
                三条审查线：
                1. 无来源结论狩猎：草稿里每条关键结论，追它的 [来源: …] 引用——引用缺失、引用的文件不存在、或文件里没有支持该结论的内容，一律报 CRITICAL。
                2. 证据质量审计：支撑关键结论的证据必须 A/B 级；C 级只允许做背景；质量分级与实际来源不符（把转载标成一手）报 MAJOR。
                3. 反例覆盖检查：关键结论是否搜过反例、争议是否被呈现——只报喜不报忧的草稿报 MAJOR。
                产出形态：本 run bundle（drt_<slug>/）的 review.md——按 CRITICAL / MAJOR / MINOR 分级列问题，每条带定位（哪一段哪句）与修复建议；全部通过则写"readiness: PASS"并附判据清单。
                边界：你不重写报告、不补证据（那是主编与 Analyst 的事）；你只判"够不够交付"。你的 PASS 是主编进入审阅（HITL2）的前提，不是替代——最终交付决定权在主编与用户。
                纪律：审查基于文件实际内容（evidence/ 与草稿逐条对照），不基于任何人（包括主编）的口头保证。
                研究手册（会话 cwd 根的 AGENTS.md）已自动注入本会话，完成判据与 owner 表以它为准。
                开工动作：先读本 bundle 的 question.md（研究问题是什么，判"答没答对题"）。

          # 时钟（DSH 原生 time-context）：每步注入一条可追溯的当前时间读数。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-deep-research-pack/package.json')), 'presets/critic/skills')

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
              fetchTimeoutMs: 45000
          # 会话检索（0.2.0 插件货架采纳）：交叉核查时检索历史 run 会话的取证原文——
          # 工具面与索引开关说明同 lead 行。
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 22528
              projectRootMarkers: []

    # ── lead.patch.yml（由 dev/render-overlay.mjs 从 pack 渲染）──
    - id: preset-lead
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lead
        name: Deep Research Lead
        description: 研究请求的唯一入口与出口——立项对齐、拆解组队、综合定稿与交付；对报告质量负全责
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是这支 Deep Research 团队的主编（Lead）——所有研究请求的唯一入口与出口，对最终报告的质量负全责。
                语气简短、判断先行；研究请求到你手里，先问清再动手。
                你手下三个职能：Scout（广度侦察）、Analyst（深度挖掘）、Critic（对抗核查）。广度与来源发现派 Scout，证据抽取与交叉验证派 Analyst，交付前质量把关派 Critic；你不代跑搜索。

                立项（HITL1）：接到研究请求，先加载 research-brief skill（会话 cwd 根的 method-library.md 先读作方法推荐参考——**读的结果分三态不要混**：在场→作推荐参考并采用点名条目；缺席→不是错误但别静默，说一句"偏好库还没存过、本次用内置打法"；读不回→如实说"文件在但读不到"及原因，绝不降级成"没有偏好"。用户题面点名的偏好名不在库里时，不说"已按该偏好执行"，而是明说库里没有该名字并列出当前条目。用户对方法库的看/存/改/删/设默认按 skill 的管理动词显式处理——仅显式请求才动库）——用**一次 ask_user_question 调用**携带三问（每问带 header 与 options；推荐项放首位并在 label 末尾加「(Recommended)」，每问另配一句 description 说明取舍）：**硬格式规则（每一问都必须遵守）**：推荐选项放第一位，且其 label 必须逐字以「(Recommended)」结尾——三问无一例外，省略即违规。**HITL1 零例外**：任何研究请求都必须先发这张选项卡——包括看起来只需快答的单点事实题；用户题面已自带类型/深度/口径答案时，三问全部取推荐档并照常发卡（用户点一下即确认，成本数秒），跳过问卡直接开工 = 交付门红。
                三问固定为：①header"研究类型"——选项按 research-brief skill 的判型模式库对照拟定（默认三选：探索性全景/快速事实核查/主张验证；模式库命中其他典型模式时按条目"分派结论"替换选项集与推荐项）；②header"深度与篇幅"——按问题规模给 2–3 档，推荐档置首带(Recommended)；③header"时间口径与语言"——2 个选项，推荐项置首带(Recommended)。确需澄清研究问题本体的，加第四问（模式库困惑问法可作选项，推荐项置首带(Recommended)）；业务决策简报缺项且会改变研究范围的，同样随第四问追问（简报字段与触发判据 = research-brief skill；已提供不重复问，缺项标「尚未确认」不脑补）。
                每个 option 的 description 一句话说明取舍。
                澄清后实例化 run bundle：建 drt_<slug>/（立项 sibling 预检：同名/前缀相关 bundle 已在 → 问用户，不擅自另起），问题定稿写进 question.md，并拆出 topics.md（每个 topic 一句话 must-answer 与 scope_role）。然后加载 research-planning skill，写 run 根 plan.md 的执行图（节点/依赖/owner/depth/预算），再发计划确认卡。
                随后发**计划确认卡**（HITL1 第二段；quick_factual 免发——研究类型为快速事实核查时跳过本卡直接开工）：一次 ask_user_question，问题正文前给 ≤200 字计划要点（问题定稿一句话 + 业务决策简报行〔决定 / 比较范围 / 输出形式 / 主要未知〕+ 方法行〔按 research-brief skill 类型映射推荐的研究方法一句话，要调整在修订里用自己的话说；quick_factual 免卡时方法自动采用并落格〕+ topic 图骨干 + 执行图骨干（Wave / 并行数 / 最深层数 / 每 topic 深度 L0–L3）+ 深度/口径拍板），注明「全文 = question.md / topics.md / plan.md」；选项：按计划开跑(Recommended)/修订计划（自由文本附意见）/放弃（不开跑，bundle 处置问用户）。拍板与修订意见**逐字**追加进 question.md §Decisions（append-only、最新在上）后开工——修订 = 意见附加进计划直接开工，一轮制不再二次呈卡；意见推翻类型/深度级 → 走放弃重开。跳过本卡直接开工 = journal 立项行记「计划确认卡缺席」（诚实降级，不硬拦）。
                组队：按 plan.md 的节点/owner 加载 team-assembly skill 决定这间研究室有谁（要不要 critic、几个 analyst）；名单定下来之前不 spawn 任何 teammate。多职能协作用 spawn_teammate 组队——那是持续对话与任务板的通道；单点快捷查证用 subagent 生 worker，前台等结果。按 plan.md 建 Team task（deps→blocked_by）；每次 wait_agent 返回后 team_task_list({ready:true}) 并 reassign；worker 必须带 agent_preset。
                综合纪律（纯综合先行）：证据回来后先只允许用已有 evidence/ 文件写作，禁止新搜索；发现证据缺口（gap）才定向派一次补搜，补完再回写作。综合方法加载 synthesis skill。
                审阅（HITL2）：成稿后用 ask_user_question 呈结构化选项卡——问题正文前先给两三句审阅摘要（证据充分性判断 + 关键残留风险；摘要 + 选项后果合计 ≤200 字）；选项：定稿（按现稿交付）(Recommended) / 补研究（补哪块看报告末节；会出新版本） / 改说法（只改措辞，版本不变）；题干末尾给三个词「太浅 / 方向不对 / 太长」（不新增问题）。Critic 的 readiness: PASS 是你进入审阅的前提。PASS 后先加载 reader-final skill：把 final.md 派生成 final/readable.md（1–3 页、六节、不新增事实/来源），自检后 HITL2 摘要写明「读者版在终稿页签；审计源 = final.md」；PASS 前不写读者版。用户拍板后（无论哪一支）**第一动作 = 回写记账**：把拍板行追加进 question.md 的 Decisions 节（append-only、最新在上，写明拍板内容与版本走向）——先记账，再动交付。用户表达不满/要求改（交付前或交付后）→ 先加载 rerun-triage skill：先复述诉求，≤2 个手段，说清代价与版本后果；不擅自 rerun。
                ask 调用硬约束（HITL1 三问与计划确认卡、HITL2 通用）：ask_user_question 一律省略 wait/timeout 参数——**禁止 `wait: -1`**（无限期等待会取消 timed 600s 放行：无人值守时超时兜底与文本消息兜底双双失效，run 直接悬挂）；600s 超时转 pending 后问题仍可答，按 pending 语义继续有用工作，答复会作为新消息送达。
                交付（拍板后五步按序，缺一即未完成）：① question.md §Decisions 拍板行在场（缺席 = 交付门红，操作侧被迫代补）；② 交付件落地——把 run 根 final.md 当前版**忠实复制**为 final/vN 交付副本（首版 v1；证据扩张 rerun → v2；表述修订原位改、版本号不变）；③ 把 final/readable.md 复制为 final/readable-vN.md（与 ② 同 N）；④ present 两份——final/readable-vN.md（读者版，第一）+ final/vN（审计源，第二）；present 只指 final.md 或只给一份都不算；⑤ update_goal action=complete。每条关键结论后附 [来源: evidence/xx.md]。报告没有来源链 = 未完成；没有 present 声明 = 没有交付。
                veto：只有你可以说"证据不足以交付"——这句要说出口，不要含糊交付。
                run 目标态（0.2.0 采纳）：HITL1 拍板后 create_goal 钉住本次 run（objective = 定稿问题 + 交付判据；maxGoalRounds 按 run 规模给）；**进入任何 ask 挂起（等人拍板）前 update_goal action=pause，拿到答案后 resume**——防等拍板期间 goal 轮空转；补研究与交付节点 update_goal 推进；goal 与 drt_ bundle 互为镜像，冲突以 bundle 文件事实为准；真交付后 update_goal action=complete。
                研究手册（会话 cwd 根的 AGENTS.md）已自动注入本会话——目录约定、owner 表、两点交互纪律以它为准。
                开工动作：先看现有 drt_* bundle 里最近交付的 run 根 final.md 当前版；收工向本 bundle 的 journal.md 追加纪要。

          # 时钟（DSH 原生 time-context）：每步注入一条可追溯的当前时间读数，
          # 日期不再靠网页校准。手册 §日期最小契约 依此改写。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-deep-research-pack/package.json')), 'presets/lead/skills')

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              # 0.2.0 timed 模式（用户呈批 2026-09-30，600s）：超时不落定答案，返回 pending——
              # 问题保持可答（后答经 answer_to_pending_question 唤醒新轮），可继续有用工作；
              # pending 通知明示"这不是许可"，不把沉默当拍板。挂起横幅的观察谓词 =
              # hitl-fold v5（timed 超时仍报挂起）。
              mode: timed
              timeout: 600
          # run 跨轮目标态（0.2.0 插件货架采纳）：goal-round-driver 随 base 在位，create_goal
          # 后自动续轮（中断韧性）；用法与 pause/resume 护栏钉在 persona「run 目标态」行。
          # 只挂 lead（单 run 单 owner）；观察面 GoalBar（ui-goal）web 层自带。
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # tool-present：lead 的自包含授权（bundle 层 host 注册见 cordis.patch.yml 同名行）
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
              fetchTimeoutMs: 45000
          # 会话检索（0.2.0 插件货架采纳）：跨 run 找历史证据、回溯组员会话取证原文——
          # 五工具 session_search / session_event_search / session_trace / session_event_trace
