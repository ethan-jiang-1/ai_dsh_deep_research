# nightly — 分钟级/构建级证据，不挡每次 push（push 门禁 = ci.yml 的 keyless，约 2 分钟）。
# 内容：vendor 构建 + 安装/生命周期/doctor/CLI 退出码/tarball（deploy）+ 真浏览器装配（client-load）+
# 回放 A/B（snapshot-replay）。registry 频率 = 本工作流执行面（`tier: nightly`）与 push 面（`tier: ci`）；
# 失败不阻塞 push，但会以本工作流红呈现；处置 = _backlog/triggers.md
# 「Linux/GitHub runner 上的真浏览器/回放冒烟」行。
name: nightly

on:
  schedule:
    - cron: "17 18 * * *"   # 每日 02:17 Asia/Shanghai（UTC 18:17）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:

  client-load:
    name: client-load (seeded home, real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (with pinned DSH submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 顺序有依赖：pack 的 tsc 需要 vendor 产出的类型（vendor-build 后才有 lib/types）。
      # client-load 的 assertVendorArtifacts 还需要 vendor 的 typert/client 产物。
      - name: Read vendor pin
        id: pin
        run: echo "sha=$(git rev-parse HEAD:vendor/dsh)" >> "$GITHUB_OUTPUT"

      # vendor 构建产物 gitignored（fresh checkout 没有），但产物只由子模块 pin 决定——
      # 按 pin SHA 缓存，命中即跳过约 3.5 分钟的构建（pin 不变 = 产物不变）。
      - name: Cache vendor build (pin tree)
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/dsh/packages/*/*/lib
            vendor/dsh/vendor/*/lib
            vendor/dsh/apps/web/dist
            vendor/dsh/native/system/packages/*/bin
          key: ${{ runner.os }}-vendor-v2-${{ steps.pin.outputs.sha }}

      - name: Build vendor (pin tree)
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: bash tools/build/vendor-build.sh

      # 冒烟有构建新鲜度自检：lib/client.js 旧于 src 即 exit 2。
      - name: Build pack (dual halves)
        run: pnpm build

      # chromium 由 vendor inspector 包的 playwright 安装（loadChromium 从 .pnpm 取 API）。
      - name: Install chromium
        run: pnpm --dir vendor/dsh/packages/experimental/inspector exec playwright install --with-deps chromium

      # --seed 自建 home（会话 + 已交付 bundle 夹具），不依赖开发 home/凭据。
      - name: Client load (seed fixture)
        run: source tools/env.sh && node --import tsx/esm checks/smoke/client-load.entry.mjs --seed tests/fixtures/client-load-home --port 3109

      - name: Upload failure scene
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-load-artifacts
          path: runtime/smoke-workspace/client-load-*
          if-no-files-found: warn

  snapshot-replay:
    name: snapshot A/B (fresh profile, keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (with pinned DSH submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Read vendor pin
        id: pin
        run: echo "sha=$(git rev-parse HEAD:vendor/dsh)" >> "$GITHUB_OUTPUT"

      # vendor 构建产物 gitignored（fresh checkout 没有），但产物只由子模块 pin 决定——
      # 按 pin SHA 缓存，命中即跳过约 3.5 分钟的构建（pin 不变 = 产物不变；v2 = 路径含
      # native/system/packages/*/bin——session flock 的 fail-closed 依赖，见 vendor-build ⑨）。
      - name: Cache vendor build (pin tree)
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/dsh/packages/*/*/lib
            vendor/dsh/vendor/*/lib
            vendor/dsh/apps/web/dist
            vendor/dsh/native/system/packages/*/bin
          key: ${{ runner.os }}-vendor-v2-${{ steps.pin.outputs.sha }}

      - name: Build vendor (pin tree)
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: bash tools/build/vendor-build.sh

      - name: Build pack (npm pack prepack)
        run: pnpm build

      - name: Prepare fresh profile + snapshot A/B
        run: |
          export DSH_DEV_HOME="$GITHUB_WORKSPACE/runtime/ci-home"
          export DSH_RUN_STATE_DIR="$GITHUB_WORKSPACE/runtime/ci-state"
          export DSH_RUN_PORT=3199
          source tools/env.sh
          bash tools/channel/boot-run.sh --prepare-profile
          node checks/smoke/snapshot-replay.entry.mjs --read-only --layers a,b --port 3110

  deploy:
    name: keyless deploy smokes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with pinned DSH submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 类型面与 pack 构建都需要 vendor 产出的类型（tsc 的 TS2307 实测）。
      - name: Read vendor pin
        id: pin
        run: echo "sha=$(git rev-parse HEAD:vendor/dsh)" >> "$GITHUB_OUTPUT"

      # vendor 构建产物 gitignored（fresh checkout 没有），但产物只由子模块 pin 决定——
      # 按 pin SHA 缓存，命中即跳过约 3.5 分钟的构建（pin 不变 = 产物不变）。
      - name: Cache vendor build (pin tree)
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/dsh/packages/*/*/lib
            vendor/dsh/vendor/*/lib
            vendor/dsh/apps/web/dist
            vendor/dsh/native/system/packages/*/bin
          key: ${{ runner.os }}-vendor-v2-${{ steps.pin.outputs.sha }}

      - name: Build vendor (pin tree)
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: bash tools/build/vendor-build.sh

      # 类型门（测试走 tsx 剥类型，typecheck 是唯一类型回归面）。
      - name: Typecheck (pack dual halves)
        run: pnpm typecheck

      - name: Build pack (pack.e2e needs lib/)
        run: pnpm build

      # 真 Loader 组装面（keyless，确定性 mock LLM）：native system.node 由 vendor-build ⑨
      # 提供（缓存 v2 携带）。方法库 Host Tool 写读 + 首请求计价两条原 dev-only 冒烟，
      # 自设进 CI 条件（CI 提供 native 构建）已满足。
      - name: Method library tool (real Loader, keyless)
        run: node checks/smoke/method-library-tool.e2e.mjs

      - name: Model experience meter (real Loader, keyless)
        run: node checks/smoke/model-experience.e2e.mjs

      # L1 真挂载（无模型）：roster + 逐角色 session/create + skills 隔离 + boot 页模块表行。
      # 用 vendor 源码基线（bootWeb 起自本仓），无需全局 dsh；DSH_HOME 由 env.sh 隔离。
      - name: L1 preset smoke (real mount, keyless)
        run: source tools/env.sh && DSH_SMOKE_REAL=1 node checks/smoke/preset.e2e.mjs

      # L2 发布/安装/卸载：export-dist 出 tarball + market，vendor CLI 作 dsh（无需全局安装）。
      - name: Export dist (L2 tarball + market)
        run: node tools/release/export-dist.mjs

      - name: L2 lifecycle smoke (install → display → remove)
        run: |
          cat > /tmp/dsh-vendor <<EOF
          #!/usr/bin/env bash
          exec env TSX_TSCONFIG_PATH="$GITHUB_WORKSPACE/tsconfig.json" node --import tsx/esm "$GITHUB_WORKSPACE/vendor/dsh/apps/cli/src/bin.ts" "\$@"
          EOF
          chmod +x /tmp/dsh-vendor
          DSH_BIN=/tmp/dsh-vendor node checks/smoke/lifecycle.entry.mjs

      # L2 干净室冷启动（仓外 home + 钉版 DSH + tarball；BUG-314：从 dev-only 升 nightly）。
      - name: L2 clean-room cold start
        run: DSH_BIN=/tmp/dsh-vendor node checks/smoke/cold-start.entry.mjs

      - name: Doctor (read-only profile/anchor/workspace/credentials)
        run: node checks/smoke/doctor.e2e.mjs

      # 入口退出码契约（BUG-213/217/218）：usage/前置 = 2、真失败 = 1、全 SKIP = 2。
      # 真边界 = 子进程 exit code，默认回归禁子进程（layering），故住 smoke 道。
      - name: CLI exit contract (keyless)
        run: node checks/smoke/cli-exit.e2e.mjs

      - name: Coverage command (observational)
        run: source tools/env.sh && pnpm test:coverage

      # 这两条契约 import vendor **源码**（组合层 Loader / 设置 schema）。默认 test 用
      # client tsconfig（paths 置空 → vendor 包解析到构建产物 lib/）；本步用根 tsconfig
      # 的 vendor 源路径映射，fresh clone 无 vendor 构建也能跑。
      - name: Vendor-source contracts (root tsconfig)
        run: pnpm test:vendor

      # 类型面不在 keyless job：`pnpm typecheck` 要 vendor 构建产物（tools/build/vendor-build.sh），
      # 而 keyless 的契约是 fresh clone 无构建也能跑。类型门在 deploy job（同一 push/PR 触发）
      # 的 vendor 构建之后执行，覆盖等价、不把构建成本摊到每次回归。
      # 门禁自测：注入案例 + 对照，经真实 verify 入口判红/判绿。此前只住在
      # "改 verify 必跑"的散文里——CI 上永不执行，门禁钝化只能在本地被发现。
      - name: Gate self-tests (injected regressions must be named red)
        run: source tools/env.sh && node checks/smoke/gates.e2e.mjs

      # 源码移交：产物边界 + HANDOFF 接收指令；git archive HEAD，无网络/模型依赖
      - name: Source handoff (artifact boundary + recipient instructions)
        run: source tools/env.sh && node checks/smoke/handoff.e2e.mjs

      # 交付回执链（合成 bundle + 合成会话日志，真 CLI）：归一/幂等/外部 present/秘密/repair
      - name: Receipt chain (run-accept end-to-end)
        run: source tools/env.sh && node checks/smoke/run-accept.e2e.mjs

      - name: Tarball shape
        run: node checks/smoke/pack.e2e.mjs

  all-checks-passed:
    name: all checks passed
    # 书签式聚合：branch protection 只认这一条；任何 needed job 的 failure/cancelled/skipped 都判红
    # （job 级 if 跳过的 check 会显示 success，这是假绿入口——2026-11-13 W3-7）。
    if: always()
    needs: [deploy, client-load, snapshot-replay]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Needed job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All checks passed
        run: echo "All needed jobs succeeded (${{ join(needs.*.result, ', ') }})"
