name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyless:
    name: keyless verify + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with pinned DSH submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch submodule tags (pin-agreement reads dsh-v* tags)
        run: git -C vendor/dsh fetch --tags --force

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (structural gates)
        run: source dev/env.sh && pnpm verify

      - name: Test (keyless regression)
        run: source dev/env.sh && pnpm test

      # 类型面也是回归面（2026-11-03 七维卫生审计 D5-1）：测试走 tsx（剥类型），
      # 类型退化不会被 pnpm test 发现。vendor 类型由 `pnpm install` 的 workspace 链接解析；
      # 若本步在 CI 报 TS2307，先看是否需要在 job 前补 `bash dev/vendor-build.sh`。
      - name: Typecheck (pack dual halves)
        run: pnpm typecheck

      # 门禁自测：87 个注入案例 + 4 个对照，经真实 verify 入口判红/判绿。此前只住在
      # "改 verify 必跑"的散文里——CI 上永不执行，门禁钝化只能在本地被发现。
      - name: Gate self-tests (injected regressions must be named red)
        run: source dev/env.sh && node scripts/smoke/gates-smoke.mjs

      # 交付回执链（合成 bundle + 合成会话日志，真 CLI）：归一/幂等/外部 present/秘密/repair
      - name: Receipt chain (run-accept end-to-end)
        run: source dev/env.sh && node scripts/smoke/run-accept-smoke.mjs

  client-load:
    name: client-load (seeded home, real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (with pinned DSH submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 冒烟有构建新鲜度自检：lib/client.js 旧于 src 即 exit 2。
      - name: Build pack (dual halves)
        run: pnpm --filter dsh-deep-research-pack build

      # client-load 的 assertVendorArtifacts 需要 vendor 的 typert/client 产物。
      - name: Build vendor (pin tree)
        run: bash dev/vendor-build.sh

      # chromium 由 vendor inspector 包的 playwright 安装（loadChromium 从 .pnpm 取 API）。
      - name: Install chromium
        run: pnpm --dir vendor/dsh/packages/experimental/inspector exec playwright install --with-deps chromium

      # --seed 自建 home（会话 + 已交付 bundle 夹具），不依赖开发 home/凭据。
      - name: Client load (seed fixture)
        run: source dev/env.sh && node --import tsx/esm scripts/smoke/client-load-smoke.mjs --seed tests/fixtures/client-load-home --port 3109

      - name: Upload failure scene
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-load-artifacts
          path: runtime/smoke-workspace/client-load-*
          if-no-files-found: warn

  deploy:
    name: keyless deploy smokes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (with pinned DSH submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build pack (pack-smoke needs lib/)
        run: pnpm --filter dsh-deep-research-pack build

      - name: Doctor (read-only profile/anchor/workspace/credentials)
        run: node scripts/smoke/doctor-smoke.mjs

      - name: Tarball shape
        run: node scripts/smoke/pack-smoke.mjs
