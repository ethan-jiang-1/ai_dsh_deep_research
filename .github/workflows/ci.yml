name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 快慢分层：每次 push 的 CI 只跑 keyless + deploy（约 5 分钟）。client-load（真浏览器）与
# snapshot-replay（回放 A/B）是分钟级重冒烟，**不进 push 门禁**——它们在 GitHub runner 上
# 仍红且根因未定（见 _backlog/triggers.md「Linux 上的真浏览器/回放冒烟」行）；本地按需跑，
# 冒烟资产仍在 checks/smoke/（registry tier = dev-only）。
jobs:
  keyless:
    name: keyless verify + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with pinned DSH submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch submodule tags (pin-agreement reads dsh-v* tags)
        run: git -C vendor/dsh fetch --tags --force

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (structural gates)
        run: source tools/env.sh && pnpm verify

      - name: Test (keyless regression)
        run: source tools/env.sh && pnpm test

      # 覆盖率是观察面、不设阈值；但命令本身必须真能跑（2026-11-04 实证：
      # test:coverage 缺 TSX_TSCONFIG_PATH，4 个 views 测试红而 pnpm test 绿）。
      # 契约侧由 layering ④b 钉共享前缀，这一步提供真实执行证据。

  all-checks-passed:
    name: all checks passed
    # 书签式聚合：branch protection 只认这一条；任何 needed job 的 failure/cancelled/skipped 都判红
    # （job 级 if 跳过的 check 会显示 success，这是假绿入口——2026-11-13 W3-7）。
    if: always()
    needs: [keyless]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Needed job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All checks passed
        run: echo "All needed jobs succeeded (${{ join(needs.*.result, ', ') }})"
