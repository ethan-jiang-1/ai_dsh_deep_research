# deep-research-pack 的 bundle 层：plugin add 时并入的默认行（host 共享面；角色差异在 presets/）。
# 语法教义（源自 shipped bundle 的 cordis.patch.yml）：
#   `- id: X` 只能替换 base/bundle 已有行；**新增行必须 `- insert:` 子列表**。
# DSH 0.1.7 preset 重设计：preset 不再有独立包（旧 @deepseek-ai/dsh-agent-presets 已删除），
#   改为「一条 @deepseek-ai/dsh-agent-preset 行 + config.plugins」——本包的角色定义在
#   presets/<role>.patch.yml，由 package.json 的 dsh.bundle.patch 数组随本文件一并装载；
#   本文件只负责把 registry 的默认 preset 指到研究主编。
# 依赖纪律：runtime 依赖声明为 peerDependencies（pre-stable API 不精确钉死），
# 兼容矩阵在 package.json 的 dsh.compatibility.dshReleases。

# ── preset roster：替换 web-app 的出厂默认（shipped registry default: standard）──
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: lead

# ── 会话全文检索（0.2.0 插件货架采纳）：base 出厂 openAt: never（seam 已挂、FTS 关着）。
#    首次搜索惰性开 SQLite FTS；:memory: = 每进程重建、零状态文件（持久化索引属 launcher
#    面——boot-context slot 语义，见 vendor session-query-sqlite 源码头注）。模型面工具行
#    在 presets/lead 与 presets/critic（tool-session-query 五工具），其余角色不挂（scoping）。──
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: first-search

# ── 上游流畸形事件并入有界重试（BUG-022 的本地缓解）：llm-retry 只重试 `retryPolicy.retryableCodes`
#    里的码，而默认集 = [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT] ——
#    `MALFORMED_RESPONSE` 不在内，故一次畸形流事件即终结回合、不重试（2026-10-11 实测：近 3 天
#    17 会话 / 46 次，lead 与队员都被打中）。此处把该码并入有界重试（maxRetries 5 + 默认退避，
#    参数与出厂默认同值），其余码原样重述——Loader 方言：replace 行的 config 整体替换、不深合并。
#    该行在 base 里无 config，故重述无副作用；不含 name（避免新增 peerDependency，只按 id 定向）。
#    判据与分母 = _backlog/_archived/suspended_bugs/BUG-022-provider-stream-malformed-turn-kill.md；理由 = Note
#    notes/implemented/2026-10-11-provider-malformed-response-retry.md。
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      maxRetries: 5
      retryableCodes:
        - EMPTY_RESPONSE
        - RATE_LIMIT
        - SERVER
        - TIMEOUT
        - TRANSPORT
        - MALFORMED_RESPONSE

# ── 检索底座（D30/D31，2026-10-27）：搜索 = DeepSeek 官方 Search API（`deepseek-search-api`；
#    DeepSeek 自建引擎，每条结果带 snippet + RFC3339 发布日期）；fetch = 本包回退 provider
#    （`deepseek-fallback-fetch`：先本地 `web-fetch-http`——真实状态码、markdown 无转义、
#    0.5–2.2s；本地取不到时才打 DeepSeek Fetch API，正文带来源标记）。
#    provider 行本身仍全部是 base 出厂行（D9 不变），本行只替换 web seam 的两项选择。
#    **两个字段必须同时重述**：Loader 的 replace 行 config 整体替换、不深合并；只写
#    searchProvider 会让 fetch 面对 http + deepseek-fetch-api 两个可用 provider →
#    WEB_PROVIDER_AMBIGUOUS。不含 name（同 llm-deepseek 行：按 id 定向，避免新增 peerDependency）。
#    回退 provider 由下方 `research-fetch-fallback` 行注册（本包 host 半第二处代码面；边界 =
#    D31）。实测 = _backlog/research/retrieval-backend/2026-10-27-provider-audit.md；理由与
#    输掉的方案 = notes/implemented/2026-10-27-{deepseek-search-api-retrieval,fetch-fallback-provider}.md。
- id: web
  config:
    searchProvider: deepseek-search-api
    fetchProvider: deepseek-fallback-fetch

- insert:
    # ── 抓取回退 provider（D31）：本地 web-fetch-http → DeepSeek Fetch API。注册 id =
    #    deepseek-fallback-fetch（上方 web 行钉它）；无 DEEPSEEK_API_KEY 时只走本地、
    #    错误里如实标 fallback unavailable。config.enabled: false = 只走本地（无需改 selection）。──
    - id: research-fetch-fallback
      name: dsh-deep-research-pack/fetch-fallback
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        localTimeoutMs: 10000
        totalBudgetMs: 28000
    # ── web 工具：**insert** 不在此声明。实证结论（RFC web-tool-rows）：web seam /
    #    web-search-deepseek / web-deepseek-api / web-fetch-http / tool-web 全部是 dsh-base 出厂行——
    #    providers 与 seam 留在 host 面，模型面 tool-web 行随各 preset 声明。此处 insert 反而
    #    会与 surface 的 preset-scoping 设计打架。选择面 = 上方 `- id: web` 替换行（D30/D31）。──
    # ── 交付物声明工具（base 无此行；host 面注册。lead 的工具授权另在 lead.patch.yml
    #    plugins 自包含声明——preset 层与 bundle 层分工，非 D16 同层重复行）──
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
    # ── 团队机制行（agent-team / tool-agent-team）不在此声明（RFC m2-p1-run-channel A 定案）：
    #    组合归 vendor agent-team-profile 层（profile 装 @…-agent-team-profile）——行带实战 config
    #    与 company D18 机械禁令（control / list-agents 禁用、subagent 强制 one-shot）。──
    # ── 团队 Web 可视面（观察与调试任务起止的最简途径；vendor 层无此行，仍归本包）──
    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
    # ── 本包自己的 client 面（D18 单点例外）：host 半是空壳，浏览器半注册右栏「研究状态」
    #    页签。行的 name 就是本包名（company-pack 同款）——host 侧加载 lib/index.js（空壳），
    #    浏览器侧经 exports["./client"] 取 lib/client.js（ModuleLoader 外壳）。──
    - id: research-client
      name: 'dsh-deep-research-pack'
