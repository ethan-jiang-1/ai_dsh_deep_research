# deep-research-pack 的 bundle 层：plugin add 时并入的默认行（host 共享面；角色差异在 presets/）。
# 语法教义（照搬 ai_dsh_company R1 实证，源自 shipped dsh-headless 的 cordis.patch.yml）：
#   `- id: X` 只能替换 base/bundle 已有行；**新增行必须 `- insert:` 子列表**。
#   agent-presets 用替换语法：web-app bundle 已 insert 此行（default: standard），
#   我们的替换行把 config 换成自己的 roots + default: lead；在无此行的组合（纯 headless）
#   会 not found 警告丢弃——那种场景用 dev/research.overlay.yml 的 insert 补。
# ⚠ baseUrl 语义（company R1 实证，app-boot/src/index.ts:799）：`ctx.baseUrl` = **profile 目录**
#   （cordis.yml 所在处的 file URL），不是本包安装目录。所以路径必须写成 profile 相对的
#   `node_modules/dsh-deep-research-pack/presets/`。
# 依赖纪律：runtime 依赖声明为 peerDependencies（pre-stable API 不精确钉死），
# 兼容矩阵在 package.json 的 dsh.compatibility.dshReleases。

# ── preset roster（替换 web-app 的出厂行；roots 自定位；默认挂研究主编）──
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: lead
    roots:
      - path: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-deep-research-pack/presets/', baseUrl))"
        trust: system

- insert:
    # ── web 工具：不在此声明。实证结论（RFC web-tool-rows）：web seam / web-search-deepseek /
    #    web-fetch-http / tool-web 四行全部是 dsh-base 出厂行——providers 与 seam 留在 host 面，
    #    模型面 tool-web 行随各 preset 声明（web-app surface 已把它移到 preset 背后）。此处
    #    insert 反而会与 surface 的 preset-scoping 设计打架。──
    # ── 交付物声明工具（base 无此行）──
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
    # ── 团队协作（主通道，用户定案）：Lead 组队、任务板、成员会话互通──
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
    # ── 团队 Web 可视面（观察与调试任务起止的最简途径）──
    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
