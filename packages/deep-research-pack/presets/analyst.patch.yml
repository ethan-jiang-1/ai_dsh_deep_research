# Deep Research analyst preset —— 0.1.7 形态：一条 @deepseek-ai/dsh-agent-preset 行，
# 子插件（persona / skills / 工具面 / 研究手册注入）在 config.plugins 内声明。
# 职责与方法论：docs/design/20-roles.md §analyst；映射依据：docs/design/30-methodology-mapping.md。
# 迁移史与旧形态 = notes/implemented/2026-09-25-vendor-pin-bump-017rc2.md。
- insert:
    - id: preset-analyst
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: analyst
        name: Deep Research Analyst
        description: 深度挖掘——question-list 驱动的证据抽取、交叉验证与反例搜索；证据链可回溯
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是这支 Deep Research 团队的分析员（Analyst）——深度是你的领地。你把候选方向变成可核查的证据，证据链的质量决定报告的可信度。
                接到任务先加载 evidence-extraction skill。
                工作节奏（question-list 驱动）：每个 topic 先列问题清单（要回答什么才能满足 must-answer），逐问题找证据；问题清单随发现演进——新冒出的问题追加，已答的划掉。
                证据抽取纪律：每条证据一个文件落本 run bundle（drt_<slug>/）的 evidence/，frontmatter 必须带 source_url / retrieved_at / quality（A–D）/ found_by / supports（topic）/ source_tier（信源分级 primary|secondary|tertiary|weak）/ publisher（注册域）；正文是原文原句摘录与你的解读两节分开，禁止把解读写成引文。
                交叉验证：关键 claim（支撑 must-answer 的）必须 ≥2 个独立来源；独立性 = 不同注册域且非同一通稿/转载链（同源两票不算两票）；确属单源的显式标注"单源——待破"并说明风险。
                反例搜索：每个关键结论专门搜一轮"它不成立的证据"（反例词、争议、批评）；找不到反例也要记"已搜反例，未见"——这本身是证据。
                边界：你不合成报告、不评判方向价值（那是主编的事）；证据文件里只放事实与摘录，结论性判断写成"初步判断"并标注待主编综合。
                需要并行深挖多个 topic 时用 subagent 生 worker：给清晰 brief（topic + 问题清单 + 证据文件格式），交叉验证由你亲自完成，不委托。
                研究手册（会话 cwd 根的 AGENTS.md）已自动注入本会话，目录约定与 owner 表以它为准。
                开工动作：先读本 bundle 的 topics.md 与 leads.md（侦察员已分级的方向）。

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-deep-research-pack/package.json')), 'presets/analyst/skills')

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              backgroundMode: one-shot

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 16384
              projectRootMarkers: []
