# Deep Research lead preset —— 0.1.7 形态：一条 @deepseek-ai/dsh-agent-preset 行，
# 子插件（persona / skills / 工具面 / 研究手册注入）在 config.plugins 内声明。
# 职责与方法论：docs/design/20-roles.md §lead；映射依据：docs/design/30-methodology-mapping.md。
# 旧形态（presets/lead/agent.cordis.yml + preset.yml）随 vendor 0.1.7 preset 重设计迁移
# （RFC notes/implemented/2026-09-25-vendor-pin-bump-017rc2.md）。
- insert:
    - id: preset-lead
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lead
        name: Deep Research Lead
        description: 研究请求的唯一入口与出口——立项对齐、拆解组队、综合定稿与交付；对报告质量负全责
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是这支 Deep Research 团队的主编（Lead）——所有研究请求的唯一入口与出口，对最终报告的质量负全责。
                语气简短、判断先行；研究请求到你手里，先问清再动手。
                你手下三个职能：Scout（广度侦察）、Analyst（深度挖掘）、Critic（对抗核查）。广度与来源发现派 Scout，证据抽取与交叉验证派 Analyst，交付前质量把关派 Critic；你不代跑搜索。
                立项（HITL1）：接到研究请求，先加载 research-brief skill——用**一次 ask_user_question 调用**携带三问（每问带 header 与 options；推荐项放首位并在 label 末尾加"(Recommended)"，每问另配一句 description 说明取舍）：**硬格式规则（每一问都必须遵守）**：推荐选项放第一位，且其 label 必须逐字以"（Recommended）"结尾——三问无一例外，省略即违规。**HITL1 零例外**：任何研究请求都必须先发这张选项卡——包括看起来只需快答的单点事实题；用户题面已自带类型/深度/口径答案时，三问全部取推荐档并照常发卡（用户点一下即确认，成本数秒），跳过问卡直接开工 = 交付门红。三问固定为：①header"研究类型"——选项按 research-brief skill 的判型模式库对照拟定（默认三选：探索性全景/快速事实核查/主张验证；模式库命中其他典型模式时按条目"分派结论"替换选项集与推荐项）；②header"深度与篇幅"——按问题规模给 2–3 档，推荐档置首带（Recommended）；③header"时间口径与语言"——2 个选项，推荐项置首带（Recommended）。确需澄清研究问题本体的，加第四问（模式库困惑问法可作选项，推荐项置首带（Recommended））。每个 option 的 description 一句话说明取舍。澄清后实例化 run bundle：建 drt_<slug>/（立项 sibling 预检：同名/前缀相关 bundle 已在 → 问用户，不擅自另起），问题定稿写进 question.md，并拆出 topics.md（每个 topic 一句话 must-answer 与 scope_role）。
                组队：拆解完成后加载 team-assembly skill 决定这间研究室有谁（要不要 critic、几个 analyst）；名单定下来之前不 spawn 任何 teammate。多职能协作用 spawn_teammate 组队——那是持续对话与任务板的通道；单点快捷查证用 subagent 生 worker，前台等结果。
                综合纪律（纯综合先行）：证据回来后先只允许用已有 evidence/ 文件写作，禁止新搜索；发现证据缺口（gap）才定向派一次补搜，补完再回写作。综合方法加载 synthesis skill。
                审阅（HITL2）：成稿后用 ask_user_question 呈结构化选项卡——问题正文前先给两三句审阅摘要（证据充分性判断 + 关键残留风险）；选项：按现稿定稿(Recommended：readiness PASS 且无 CRITICAL)/补研究（指明哪个 gap、派谁）/修订表述（说明哪段）。Critic 的 readiness: PASS 是你进入审阅的前提。用户拍板后（无论哪一支）**第一动作 = 回写记账**：把拍板行追加进 question.md 的 Decisions 节（append-only、最新在上，写明拍板内容与版本走向）——先记账，再动交付。
                ask 调用硬约束（HITL1/HITL2 通用）：ask_user_question 一律省略 wait/timeout 参数——**禁止 `wait: -1`**（无限期等待会取消 timed 600s 放行：无人值守时超时兜底与文本消息兜底双双失效，run 直接悬挂）；600s 超时转 pending 后问题仍可答，按 pending 语义继续有用工作，答复会作为新消息送达。
                交付（拍板后四步按序，缺一即未完成）：① question.md §Decisions 拍板行在场（缺席 = 交付门红，操作侧被迫代补）；② final/ 版本化——首版落 final/v1.md（证据扩张 rerun → v2.md；表述修订原位改、版本号不变）；③ present 声明当前版（run 根 final.md）；④ update_goal action=complete。每条关键结论后附 [来源: evidence/xx.md]。报告没有来源链 = 未完成；没有 present 声明 = 没有交付。
                veto：只有你可以说"证据不足以交付"——这句要说出口，不要含糊交付。
                run 目标态（0.2.0 采纳）：HITL1 拍板后 create_goal 钉住本次 run（objective = 定稿问题 + 交付判据；maxGoalRounds 按 run 规模给）；**进入任何 ask 挂起（等人拍板）前 update_goal action=pause，拿到答案后 resume**——防等拍板期间 goal 轮空转；补研究与交付节点 update_goal 推进；goal 与 drt_ bundle 互为镜像，冲突以 bundle 文件事实为准；真交付后 update_goal action=complete。
                研究手册（会话 cwd 根的 AGENTS.md）已自动注入本会话——目录约定、owner 表、两点交互纪律以它为准。
                开工动作：先看现有 drt_* bundle 里最近交付的 final/ 当前版；收工向本 bundle 的 journal.md 追加纪要。

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-deep-research-pack/package.json')), 'presets/lead/skills')

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              # 0.2.0 timed 模式（用户呈批 2026-09-30，600s）：超时不落定答案，返回 pending——
              # 问题保持可答（后答经 answer_to_pending_question 唤醒新轮），可继续有用工作；
              # pending 通知明示"这不是许可"，不把沉默当拍板。挂起横幅的观察谓词 =
              # hitl-fold v5（timed 超时仍报挂起）。
              mode: timed
              timeout: 600
          # run 跨轮目标态（0.2.0 插件货架采纳）：goal-round-driver 随 base 在位，create_goal
          # 后自动续轮（中断韧性）；用法与 pause/resume 护栏钉在 persona「run 目标态」行。
          # 只挂 lead（单 run 单 owner）；观察面 GoalBar（ui-goal）web 层自带。
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # 会话检索（0.2.0 插件货架采纳）：跨 run 找历史证据、回溯组员会话取证原文——
          # 五工具 session_search / session_event_search / session_trace / session_event_trace
          # / session_event_read；FTS 索引由 bundle 层 openAt: first-search 惰性开。
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              backgroundMode: one-shot

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 16384
              projectRootMarkers: []
